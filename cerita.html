          "Lonjakan daya muat energi magnetik yang tidak stabil itu membuat ruang di sekitarnya bergetar hebat memancarkan cahaya menyilaukan.",
          "Di hadapan kedua matanya, jutaan garis lintas waktu berpilin bagai benang cahaya kosmik pijar yang siap runtuh total kapan saja.",
          "Dengan kepala dingin, tangan cekatan, dan keahlian teknis tingkat tinggi, ia berhasil menyolder ulang inti sirkuit mikro.",
          "Ia memperbaikinya tepat sepersekian detik sebelum garis waktunya terhapus permanen dari eksistensi semesta raya yang luas.",
          "Layar monitor kendali utama berangsur-angsur kembali menyala normal dengan warna biru terang, menandakan keberhasilannya menaklukkan anomali.",
          "Ardi menarik napas lega yang amat panjang, menyadari sepenuhnya bahwa penjelajahan waktu menuntut tanggung jawab moral yang besar.",
          "Ia berjanji pada dirinya sendiri untuk menggunakan pengetahuan kosmik tersebut demi kemajuan peradaban umat manusia di masa depan."
        ]
      }
    ];

    const storyGrid = document.getElementById('story-grid');
    const catalogView = document.getElementById('catalog-view');
    const readerView = document.getElementById('reader-view');
    const filterBtns = document.querySelectorAll('.filter-btn');

    // Render Kartu Cerita sesuai Kategori
    function renderStories(filter = 'all') {
      storyGrid.innerHTML = '';
      const filtered = filter === 'all' ? stories : stories.filter(s => s.category === filter);

      filtered.forEach(story => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openReader(story.id);
        card.innerHTML = `
          <div>
            <div class="genre">${story.label} • ${story.duration}</div>
            <h3>${story.id}. ${story.title}</h3>
            <p>${story.excerpt}</p>
          </div>
          <span class="read-more">Baca Cerita Ini →</span>
        `;
        storyGrid.appendChild(card);
      });
    }

    // Buka Mode Baca Terfokus
    function openReader(id) {
      const story = stories.find(s => s.id === id);
      if (!story) return;

      document.getElementById('reader-title').textContent = story.title;
      document.getElementById('reader-meta').textContent = `Kategori: ${story.label} • ${story.duration}`;
      document.getElementById('reader-image').src = story.image;
      
      const contentDiv = document.getElementById('reader-content');
      contentDiv.innerHTML = story.paragraphs.map(p => `<p>${p}</p>`).join('');

      catalogView.classList.add('hidden');
      readerView.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Kembali ke Daftar Katalog
    function closeReader() {
      readerView.classList.add('hidden');
      catalogView.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Event Klik Tombol Filter Kategori
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderStories(btn.getAttribute('data-filter'));
      });
    });

    // Tampilkan semua cerita saat pertama kali dibuka
    renderStories('all');

    // Skrip Dark/Light Mode & localStorage
    const themeToggle = document.getElementById('theme-toggle');
    const body = document.body;

    if (localStorage.getItem('tema') === 'dark') {
      body.classList.add('dark-mode');
      themeToggle.textContent = '☀️ Mode Siang';
    }

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-mode');
      if (body.classList.contains('dark-mode')) {
        localStorage.setItem('tema', 'dark');
        themeToggle.textContent = '☀️ Mode Siang';
      } else {
        localStorage.setItem('tema', 'light');
        themeToggle.textContent = '🌙 Mode Malam';
      }
    });
  </script>
</body>
</html>
